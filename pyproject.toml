[project]
name = "laya-agent"
version = "0.1.0"
description = "Local, open-weight typed decisions (Laya on MLX): a decision server for agents, a browser agent, and benchmarks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "httpx[http2]>=0.28,<1",
    "laya-mlx[demo]",
    "textual>=0.60,<1",
]

[project.scripts]
laya-agent = "laya_agent.cli:main"
laya = "laya_ultrafast.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laya_agent", "laya_ultrafast"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"laya_agent/capabilities.py" = ["E501"]
"laya_agent/usecases.py" = ["E501"]
"laya_agent/registry.py" = ["E501"]
"laya_agent/tui.py" = ["E501"]

[tool.uv.sources]
# PyPI 0.1.x lacks predict_shortlist; pin the git revision we tested.
laya-mlx = { git = "https://github.com/mizorewww/laya-mlx" }
